name: kodi-apk

# Free GitHub Actions only. Builds the branded FEFC app (a re-branded, re-signed, preconfigured build of STOCK Kodi, GPL) and
# publishes it to R2 (fan-edit-media/kodi/FEFC-Kodi.apk + version.json -> https://fefc-collection.pages.dev/kodi-app/...).
# Runs daily: detects a NEW stable Kodi release (or changed FEFC add-on/skin sources) and rebuilds; otherwise it does nothing.
# Signed with the DEDICATED Kodi keystore (FEFC_KODI_*), never the FEFC WebView app key.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false
  schedule:
    - cron: '30 12 * * *'
  push:
    branches: [main]
    paths:
      - 'kodi-src/**'
      - 'tools/build_kodi_apk.py'
      - 'tools/kodi_brand.py'
      - 'tools/kodi_navsfx.py'
      - 'tools/build_kodi_skin.py'
      - 'assets/intro-tv.mp4'
      - '.github/workflows/kodi-apk.yml'

permissions:
  contents: read

concurrency:
  group: kodi-apk
  cancel-in-progress: false

env:
  EXPECT_CERT_PREFIX: "e3890a8c"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sound cues
        run: |
          set -euo pipefail
          node --test tests/sound-cues.test.js tests/release-064.test.js
      - name: Tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # ubuntu-latest (26.04) has no ffmpeg. apt-get install then sat silent for
          # ~26 min after security.ubuntu.com failed to resolve (run 43048719924,
          # attempt 1). Bound apt, and if it does not finish, use a pinned static build.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            apt_ok=0
            if timeout 60 sudo apt-get \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 \
                update \
              && timeout 120 sudo apt-get \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                install -y --no-install-recommends ffmpeg; then
              apt_ok=1
            fi
            if [ "$apt_ok" != 1 ]; then
              echo "apt did not install ffmpeg; downloading pinned static ffmpeg 7.0.2"
              curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 \
                -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
                https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz
              rm -rf "$RUNNER_TEMP/ffmpeg-static"
              mkdir -p "$RUNNER_TEMP/ffmpeg-static"
              tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg-static"
              bin=$(find "$RUNNER_TEMP/ffmpeg-static" -type f -name ffmpeg -print -quit)
              test -n "$bin"
              sudo install -m 755 "$bin" /usr/local/bin/ffmpeg
            fi
          fi
          ffmpeg -version | head -n 1
          pip install --timeout 60 --retries 5 pillow numpy scipy
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 \
            -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "APKTOOL=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"
      - name: Find latest stable Kodi (armeabi-v7a) + decide whether to rebuild
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' > plan.env
          import re, urllib.request, urllib.error, hashlib, os, json, subprocess
          html = urllib.request.urlopen('https://mirrors.kodi.tv/releases/android/arm/', timeout=60).read().decode('utf-8', 'ignore')
          names = set(re.findall(r'kodi-(\d+\.\d+(?:\.\d+)?)-([A-Za-z]+)-armeabi-v7a\.apk', html))
          best = max(names, key=lambda n: tuple(int(x) for x in n[0].split('.')))   # only plain "<ver>-<Codename>" = stable releases
          ver, code = best
          apk = 'kodi-%s-%s-armeabi-v7a.apk' % (ver, code)
          # hash of everything that goes into the app besides stock Kodi
          h = hashlib.sha256()
          for base in ('kodi-src', 'tools/build_kodi_apk.py', 'tools/kodi_brand.py', 'tools/build_kodi_skin.py', 'tools/kodi_navsfx.py', 'assets/sfx/ui-back.wav', 'assets/intro-tv.mp4', 'assets/fefc-logo.png', 'assets/fefc-wordmark.png'):
              paths = [base] if os.path.isfile(base) else [os.path.join(d, f) for d, _, fs in os.walk(base) for f in fs]
              for p in sorted(paths):
                  h.update(p.encode()); h.update(open(p, 'rb').read())
          src = h.hexdigest()[:12]
          cur = {}
          req = urllib.request.Request('https://fefc-collection.pages.dev/kodi-app/version.json?ts=%s' % os.getpid(), headers={'User-Agent': 'FEFC-Kodi-Build'})
          try:
              cur = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise SystemExit('cannot read the published version.json (HTTP %s): refusing to guess the build number' % e.code)
          except Exception as e:
              raise SystemExit('cannot read the published version.json (%s): refusing to guess the build number' % e)
          force = os.environ.get('FORCE') == 'true'
          rebuild = force or cur.get('kodi') != ver or cur.get('src') != src
          print('KODI_VER=%s\nKODI_APK=%s\nSRC_HASH=%s\nREBUILD=%s\nPREV_BUILD=%s' % (ver, apk, src, str(rebuild).lower(), cur.get('build', 0)))
          PY
          cat plan.env; cat plan.env >> "$GITHUB_ENV"
        env:
          FORCE: ${{ inputs.force }}
      - name: Download stock Kodi
        if: env.REBUILD == 'true'
        run: |
          curl -fsSL -o stock.apk "https://mirrors.kodi.tv/releases/android/arm/${KODI_APK}"
          # 64-bit stock Kodi (same version) for the new-package app: Pixel Fold/Tablet are 64-bit-only
          curl -fsSL -o stock64.apk "https://mirrors.kodi.tv/releases/android/arm64-v8a/${KODI_APK/armeabi-v7a/arm64-v8a}"
      - name: Build + sign branded FEFC app
        if: env.REBUILD == 'true'
        env:
          FEFC_KODI_KS_PASS: ${{ secrets.FEFC_KODI_KEYSTORE_PASSWORD }}
          FEFC_KODI_KEY_ALIAS: ${{ secrets.FEFC_KODI_KEY_ALIAS }}
          KS_B64: ${{ secrets.FEFC_KODI_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kodi.jks"
          echo "FEFC_KODI_KEYSTORE=$RUNNER_TEMP/kodi.jks" >> "$GITHUB_ENV"
          export FEFC_KODI_KEYSTORE="$RUNNER_TEMP/kodi.jks"
          NEXT=$(( PREV_BUILD + 1 ))
          APPV=$(tr -d '\r\n' < kodi-src/fefc-version.txt)
          echo "APP_VERSION=$APPV" >> "$GITHUB_ENV"
          printf '{"kodi":"%s","build":%s,"src":"%s","version":"%s"}\n' "$KODI_VER" "$NEXT" "$SRC_HASH" "$APPV" > kodi-src/fefc-build.json
          python3 tools/build_kodi_apk.py stock.apk FEFC-Kodi.apk
          # same source, same key, same versionCode: new-install package that coexists with Play Store Kodi
          FEFC_KODI_PACKAGE=com.fefc.kodi FEFC_EXTRA_ABI_APK=stock.apk python3 tools/build_kodi_apk.py stock64.apk FEFC.apk
          echo "NEXT_BUILD=$NEXT" >> "$GITHUB_ENV"
      - name: Verify (signature, cert, manifest, banner, add-ons)
        if: env.REBUILD == 'true'
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" verify --print-certs FEFC-Kodi.apk | tee cert.txt
          grep -qi "certificate SHA-256 digest: ${EXPECT_CERT_PREFIX}" cert.txt
          "$BUILD_TOOLS/aapt2" dump badging FEFC-Kodi.apk | tee badging.txt | head -5
          grep -q "application-label:'FEFC'" badging.txt
          grep -q "banner='res/drawable" badging.txt
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/plugin.video.fefc/addon.xml"
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/repository.fefc/addon.xml"
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/skin.fefc/addon.xml"
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/skin.fefc/fonts/Jura-Regular.ttf"
          unzip -l FEFC-Kodi.apk | grep -q "lib/armeabi-v7a/libkodi.so"
          "$BUILD_TOOLS/apksigner" verify --print-certs FEFC.apk | grep -qi "certificate SHA-256 digest: ${EXPECT_CERT_PREFIX}"
          "$BUILD_TOOLS/aapt2" dump badging FEFC.apk | tee badging2.txt | head -3
          grep -q "package: name='com.fefc.kodi'" badging2.txt
          unzip -l FEFC.apk | grep -q "lib/arm64-v8a/libkodi.so"
          python3 tools/verify_apk_cues.py FEFC-Kodi.apk FEFC.apk
          unzip -l FEFC.apk | grep -q "lib/armeabi-v7a/libkodi.so"
          rm -rf sochk && mkdir sochk && unzip -q -o FEFC.apk 'lib/*' -d sochk
          for so in sochk/lib/*/libkodi.so; do grep -a -q -F 'com.fefc.kodi' "$so"; ! grep -a -q -E 'org[./_]xbmc[./_]kodi' "$so" || { echo "old package left in $so"; exit 1; }; done
          ! unzip -l FEFC-Kodi.apk | grep -q "lib/arm64-v8a/"
          grep -q "package: name='org.xbmc.kodi'" badging.txt
          "$BUILD_TOOLS/aapt2" dump xmltree FEFC.apk --file AndroidManifest.xml | grep -q 'com.fefc.kodi.Splash'
          ls -l FEFC-Kodi.apk FEFC.apk
      - name: Publish to R2 (kodi/FEFC-Kodi.apk + version.json)
        if: env.REBUILD == 'true'
        run: |
          set -euo pipefail
          SHA=$(sha256sum FEFC-Kodi.apk | cut -d' ' -f1); SIZE=$(stat -c%s FEFC-Kodi.apk)
          SHA2=$(sha256sum FEFC.apk | cut -d' ' -f1); SIZE2=$(stat -c%s FEFC.apk)
          # Same Android fields as before. If a platforms object is already on the server, it is copied
          # onto the new file. This step still uploads only the two APKs and version.json.
          SHA="$SHA" SIZE="$SIZE" SHA2="$SHA2" SIZE2="$SIZE2" python3 tools/fefc_release_manifest.py write-android --out version.json
          npm ci >/dev/null 2>&1 || npm install >/dev/null 2>&1
          npx wrangler r2 object put fan-edit-media/kodi/FEFC-Kodi.apk --file=FEFC-Kodi.apk --content-type=application/vnd.android.package-archive --remote
          npx wrangler r2 object put fan-edit-media/kodi/FEFC.apk --file=FEFC.apk --content-type=application/vnd.android.package-archive --remote
          npx wrangler r2 object put fan-edit-media/kodi/version.json --file=version.json --content-type=application/json --remote
          cat version.json
      - name: Nothing to do
        if: env.REBUILD != 'true'
        run: echo "FEFC app already built from Kodi $KODI_VER + current FEFC sources - no rebuild needed."
