name: kodi-apk

# Free GitHub Actions only. Builds the branded FEFC app (a re-branded, re-signed, preconfigured build of STOCK Kodi, GPL)
# for Fire TV / Android (FEFC-Kodi.apk org.xbmc.kodi, FEFC.apk com.fefc.kodi) AND for macOS (FEFC-Mac.dmg Apple Silicon,
# FEFC-Mac-Intel.dmg Intel), plus the Kodi add-on repository (kodi-repo/addons.xml + zips), all from the same checkout,
# the same fefc-version.txt label and the same build number. One publish job uploads everything to R2
# (fan-edit-media/kodi/* and fan-edit-media/kodi-repo/* -> https://fefc-collection.pages.dev/kodi-app/ and /kodi-repo/)
# and writes version.json last. If the Mac job fails, Android still ships and version.json drops platforms.macos, so a Mac
# never downloads an image from an older build.
# Runs daily: detects a NEW stable Kodi release (or changed FEFC add-on/skin/build sources) and rebuilds; otherwise it does nothing.
# Signed with the DEDICATED Kodi keystore (FEFC_KODI_*), never the FEFC WebView app key.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false
      publish:
        description: "Upload to R2 (off = build and test only, e.g. on a branch)"
        type: boolean
        default: true
  schedule:
    - cron: '30 12 * * *'
  push:
    branches: [main]
    paths:
      - 'kodi-src/**'
      - 'tools/build_kodi_apk.py'
      - 'tools/kodi_brand.py'
      - 'tools/kodi_navsfx.py'
      - 'tools/build_kodi_skin.py'
      - 'tools/build_kodi_macos.py'
      - 'tools/fefc_kodi_bundle.py'
      - 'tools/kodi_upstream.py'
      - 'tools/build_kodi_repo.py'
      - 'tools/fefc_release_manifest.py'
      - 'assets/intro-tv.mp4'
      - '.github/workflows/kodi-apk.yml'

permissions:
  contents: read

concurrency:
  group: kodi-apk
  cancel-in-progress: false

env:
  EXPECT_CERT_PREFIX: "e3890a8c"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      rebuild: ${{ steps.plan.outputs.REBUILD }}
      kodi_ver: ${{ steps.plan.outputs.KODI_VER }}
      src_hash: ${{ steps.plan.outputs.SRC_HASH }}
      next_build: ${{ steps.apk.outputs.NEXT_BUILD }}
      app_version: ${{ steps.apk.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sound cues
        run: |
          set -euo pipefail
          node --test tests/sound-cues.test.js tests/release-064.test.js
      - name: Tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # ubuntu-latest (26.04) has no ffmpeg. apt-get install then sat silent for
          # ~26 min after security.ubuntu.com failed to resolve (run 43048719924,
          # attempt 1). Bound apt, and if it does not finish, use a pinned static build.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            apt_ok=0
            if timeout 60 sudo apt-get \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 \
                update \
              && timeout 120 sudo apt-get \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                install -y --no-install-recommends ffmpeg; then
              apt_ok=1
            fi
            if [ "$apt_ok" != 1 ]; then
              echo "apt did not install ffmpeg; downloading pinned static ffmpeg 7.0.2"
              curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 \
                -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
                https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz
              rm -rf "$RUNNER_TEMP/ffmpeg-static"
              mkdir -p "$RUNNER_TEMP/ffmpeg-static"
              tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg-static"
              bin=$(find "$RUNNER_TEMP/ffmpeg-static" -type f -name ffmpeg -print -quit)
              test -n "$bin"
              sudo install -m 755 "$bin" /usr/local/bin/ffmpeg
            fi
          fi
          ffmpeg -version | head -n 1
          pip install --timeout 60 --retries 5 pillow numpy scipy
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 \
            -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "APKTOOL=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"
      - name: Find latest stable Kodi (armeabi-v7a) + decide whether to rebuild
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' > plan.env
          import re, urllib.request, urllib.error, hashlib, os, json, subprocess
          html = urllib.request.urlopen('https://mirrors.kodi.tv/releases/android/arm/', timeout=60).read().decode('utf-8', 'ignore')
          names = set(re.findall(r'kodi-(\d+\.\d+(?:\.\d+)?)-([A-Za-z]+)-armeabi-v7a\.apk', html))
          best = max(names, key=lambda n: tuple(int(x) for x in n[0].split('.')))   # only plain "<ver>-<Codename>" = stable releases
          ver, code = best
          apk = 'kodi-%s-%s-armeabi-v7a.apk' % (ver, code)
          # hash of everything that goes into the app besides stock Kodi
          h = hashlib.sha256()
          for base in ('kodi-src', 'tools/build_kodi_apk.py', 'tools/kodi_brand.py', 'tools/build_kodi_skin.py', 'tools/kodi_navsfx.py', 'tools/build_kodi_macos.py', 'tools/fefc_kodi_bundle.py', 'tools/build_kodi_repo.py', 'assets/sfx/ui-back.wav', 'assets/intro-tv.mp4', 'assets/fefc-logo.png', 'assets/fefc-wordmark.png'):
              paths = [base] if os.path.isfile(base) else [os.path.join(d, f) for d, _, fs in os.walk(base) for f in fs]
              for p in sorted(paths):
                  h.update(p.encode()); h.update(open(p, 'rb').read())
          src = h.hexdigest()[:12]
          cur = {}
          req = urllib.request.Request('https://fefc-collection.pages.dev/kodi-app/version.json?ts=%s' % os.getpid(), headers={'User-Agent': 'FEFC-Kodi-Build'})
          try:
              cur = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise SystemExit('cannot read the published version.json (HTTP %s): refusing to guess the build number' % e.code)
          except Exception as e:
              raise SystemExit('cannot read the published version.json (%s): refusing to guess the build number' % e)
          force = os.environ.get('FORCE') == 'true'
          rebuild = force or cur.get('kodi') != ver or cur.get('src') != src
          print('KODI_VER=%s\nKODI_APK=%s\nSRC_HASH=%s\nREBUILD=%s\nPREV_BUILD=%s' % (ver, apk, src, str(rebuild).lower(), cur.get('build', 0)))
          PY
          cat plan.env; cat plan.env >> "$GITHUB_ENV"; cat plan.env >> "$GITHUB_OUTPUT"
        env:
          FORCE: ${{ inputs.force }}
      - name: Download stock Kodi
        if: env.REBUILD == 'true'
        run: |
          curl -fsSL -o stock.apk "https://mirrors.kodi.tv/releases/android/arm/${KODI_APK}"
          # 64-bit stock Kodi (same version) for the new-package app: Pixel Fold/Tablet are 64-bit-only
          curl -fsSL -o stock64.apk "https://mirrors.kodi.tv/releases/android/arm64-v8a/${KODI_APK/armeabi-v7a/arm64-v8a}"
      - name: Build + sign branded FEFC app
        id: apk
        if: env.REBUILD == 'true'
        env:
          FEFC_KODI_KS_PASS: ${{ secrets.FEFC_KODI_KEYSTORE_PASSWORD }}
          FEFC_KODI_KEY_ALIAS: ${{ secrets.FEFC_KODI_KEY_ALIAS }}
          KS_B64: ${{ secrets.FEFC_KODI_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kodi.jks"
          echo "FEFC_KODI_KEYSTORE=$RUNNER_TEMP/kodi.jks" >> "$GITHUB_ENV"
          export FEFC_KODI_KEYSTORE="$RUNNER_TEMP/kodi.jks"
          NEXT=$(( PREV_BUILD + 1 ))
          APPV=$(tr -d '\r\n' < kodi-src/fefc-version.txt)
          echo "APP_VERSION=$APPV" >> "$GITHUB_ENV"
          printf '{"kodi":"%s","build":%s,"src":"%s","version":"%s"}\n' "$KODI_VER" "$NEXT" "$SRC_HASH" "$APPV" > kodi-src/fefc-build.json
          python3 tools/build_kodi_apk.py stock.apk FEFC-Kodi.apk
          # same source, same key, same versionCode: new-install package that coexists with Play Store Kodi
          FEFC_KODI_PACKAGE=com.fefc.kodi FEFC_EXTRA_ABI_APK=stock.apk python3 tools/build_kodi_apk.py stock64.apk FEFC.apk
          echo "NEXT_BUILD=$NEXT" >> "$GITHUB_ENV"
          { echo "NEXT_BUILD=$NEXT"; echo "APP_VERSION=$APPV"; } >> "$GITHUB_OUTPUT"
      - name: Verify (signature, cert, manifest, banner, add-ons)
        if: env.REBUILD == 'true'
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" verify --print-certs FEFC-Kodi.apk | tee cert.txt
          grep -qi "certificate SHA-256 digest: ${EXPECT_CERT_PREFIX}" cert.txt
          "$BUILD_TOOLS/aapt2" dump badging FEFC-Kodi.apk | tee badging.txt | head -5
          grep -q "application-label:'FEFC'" badging.txt
          grep -q "banner='res/drawable" badging.txt
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/plugin.video.fefc/addon.xml"
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/repository.fefc/addon.xml"
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/skin.fefc/addon.xml"
          unzip -l FEFC-Kodi.apk | grep -q "assets/addons/skin.fefc/fonts/Jura-Regular.ttf"
          unzip -l FEFC-Kodi.apk | grep -q "lib/armeabi-v7a/libkodi.so"
          "$BUILD_TOOLS/apksigner" verify --print-certs FEFC.apk | grep -qi "certificate SHA-256 digest: ${EXPECT_CERT_PREFIX}"
          "$BUILD_TOOLS/aapt2" dump badging FEFC.apk | tee badging2.txt | head -3
          grep -q "package: name='com.fefc.kodi'" badging2.txt
          unzip -l FEFC.apk | grep -q "lib/arm64-v8a/libkodi.so"
          python3 tools/verify_apk_cues.py FEFC-Kodi.apk FEFC.apk
          unzip -l FEFC.apk | grep -q "lib/armeabi-v7a/libkodi.so"
          rm -rf sochk && mkdir sochk && unzip -q -o FEFC.apk 'lib/*' -d sochk
          for so in sochk/lib/*/libkodi.so; do grep -a -q -F 'com.fefc.kodi' "$so"; ! grep -a -q -E 'org[./_]xbmc[./_]kodi' "$so" || { echo "old package left in $so"; exit 1; }; done
          ! unzip -l FEFC-Kodi.apk | grep -q "lib/arm64-v8a/"
          grep -q "package: name='org.xbmc.kodi'" badging.txt
          "$BUILD_TOOLS/aapt2" dump xmltree FEFC.apk --file AndroidManifest.xml | grep -q 'com.fefc.kodi.Splash'
          ls -l FEFC-Kodi.apk FEFC.apk
      - name: Keep the APKs for the publish job
        if: env.REBUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fefc-apks
          path: |
            FEFC-Kodi.apk
            FEFC.apk
          retention-days: 7
          if-no-files-found: error
      - name: Nothing to do
        if: env.REBUILD != 'true'
        run: echo "FEFC app already built from Kodi $KODI_VER + current FEFC sources - no rebuild needed."

  mac:
    # Same checkout, label and build number as the APKs. Kodi for macOS ships separate arm64 and x86_64 images.
    needs: build
    if: needs.build.outputs.rebuild == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KODI_VER: ${{ needs.build.outputs.kodi_ver }}
      NEXT_BUILD: ${{ needs.build.outputs.next_build }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          set -euo pipefail
          brew install ffmpeg || true
          brew install libicns || true
          pip install pillow numpy scipy
      - name: Download stock Kodi for macOS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kodi"
          python3 - <<'PY'
          import os, re, sys, urllib.request
          sys.path.insert(0, 'tools')
          import kodi_upstream
          html = ''
          for arch in ('arm64', 'x86_64'):
              html += urllib.request.urlopen('https://mirrors.kodi.tv/releases/osx/%s/' % arch, timeout=60).read().decode('utf-8', 'ignore') + '\n'
          found = kodi_upstream.stable_dmgs(re.findall(r'kodi-[^"<> ]+\.dmg', html))
          want = os.environ['KODI_VER']
          for arch in ('arm64', 'x86_64'):
              have = {v: n for (v, a), n in found.items() if a == arch}
              if want not in have:
                  raise SystemExit('no Kodi %s %s disk image on the mirror (have %s)' % (want, arch, sorted(have)))
              name = have[want]
              url = kodi_upstream.dmg_url(arch, name)
              print('get', url)
              urllib.request.urlretrieve(url, os.path.join(os.environ['RUNNER_TEMP'], 'kodi', name))
          PY
      - name: Build FEFC for Mac (ad-hoc signed)
        run: |
          set -euo pipefail
          python3 tools/build_kodi_macos.py --arch all --cache "$RUNNER_TEMP/kodi" --kodi-version "$KODI_VER" --build "$NEXT_BUILD" --out dist
          mv dist/FEFC-macOS-arm64.dmg dist/FEFC-Mac.dmg
          mv dist/FEFC-macOS-arm64.dmg.report.json dist/FEFC-Mac.dmg.report.json
          mv dist/FEFC-macOS-x86_64.dmg dist/FEFC-Mac-Intel.dmg
          mv dist/FEFC-macOS-x86_64.dmg.report.json dist/FEFC-Mac-Intel.dmg.report.json
          ls -l dist
      - name: Verify the disk images (mount, signature, architecture, FEFC add-ons, build number)
        run: |
          set -euo pipefail
          for pair in "FEFC-Mac.dmg:arm64" "FEFC-Mac-Intel.dmg:x86_64"; do
            img="dist/${pair%%:*}"; arch="${pair##*:}"
            hdiutil verify "$img"
            mnt="$RUNNER_TEMP/mnt-$arch"; mkdir -p "$mnt"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$img"
            app="$mnt/FEFC.app"
            test -f "$mnt/Read Me.txt"
            codesign --verify --deep --strict --verbose=2 "$app"
            exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = FEFC
            lipo -archs "$exe" | tee "$RUNNER_TEMP/archs.txt"; grep -qw "$arch" "$RUNNER_TEMP/archs.txt"
            python3 - "$app" "$NEXT_BUILD" "$APP_VERSION" <<'PY'
          import json, re, sys
          app, build, label = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          k = app + '/Contents/Resources/Kodi'
          rec = json.load(open(k + '/fefc-build.json'))
          assert rec['build'] == build and rec['version'] == label and rec['platform'] == 'macos', rec
          src = re.search(r'version="([^"]+)"', open('kodi-src/plugin.video.fefc/addon.xml').read().split('<addon', 1)[1]).group(1)
          got = re.search(r'version="([^"]+)"', open(k + '/addons/plugin.video.fefc/addon.xml').read().split('<addon', 1)[1]).group(1)
          assert got == src, (got, src)
          for aid in ('skin.fefc', 'repository.fefc', 'resource.uisounds.fefc'):
              open(k + '/addons/%s/addon.xml' % aid).read()
          print('ok', rec, 'plugin.video.fefc', got)
          PY
            hdiutil detach "$mnt"
          done
      - name: Launch test (Apple Silicon image, no window interaction)
        continue-on-error: true
        run: |
          set -uo pipefail
          mnt="$RUNNER_TEMP/mnt-run"; mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/FEFC-Mac.dmg
          ditto "$mnt/FEFC.app" "$RUNNER_TEMP/FEFC.app"; hdiutil detach "$mnt"
          exe="$RUNNER_TEMP/FEFC.app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$RUNNER_TEMP/FEFC.app/Contents/Info.plist")"
          rm -f "$HOME/Library/Logs/kodi.log"
          "$exe" > "$RUNNER_TEMP/kodi-stdout.txt" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do sleep 4; if ! kill -0 $pid 2>/dev/null; then break; fi; if grep -q "plugin.video.fefc" "$HOME/Library/Logs/kodi.log" 2>/dev/null && grep -q "skin.fefc" "$HOME/Library/Logs/kodi.log" 2>/dev/null; then sleep 8; break; fi; done
          alive=no; kill -0 $pid 2>/dev/null && alive=yes
          kill $pid 2>/dev/null; sleep 3; kill -9 $pid 2>/dev/null || true
          log="$HOME/Library/Logs/kodi.log"
          cp "$log" dist/launch-kodi.log 2>/dev/null || true
          {
            echo "running_after_test=$alive"
            echo "skin_fefc=$(grep -c 'skin.fefc' "$log" 2>/dev/null || echo 0)"
            echo "plugin_fefc=$(grep -c 'plugin.video.fefc' "$log" 2>/dev/null || echo 0)"
            echo "errors=$(grep -c ' error <general>' "$log" 2>/dev/null || echo 0)"
          } | tee dist/launch-test.txt
          grep -E "Starting Kodi|load skin|skin.fefc|plugin.video.fefc|FEFC" "$log" 2>/dev/null | head -40 || true
          grep -q '^skin_fefc=[1-9]' dist/launch-test.txt && grep -q '^plugin_fefc=[1-9]' dist/launch-test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fefc-mac
          path: |
            dist/FEFC-Mac.dmg
            dist/FEFC-Mac.dmg.report.json
            dist/FEFC-Mac-Intel.dmg
            dist/FEFC-Mac-Intel.dmg.report.json
            dist/launch-test.txt
            dist/launch-kodi.log
          retention-days: 7
          if-no-files-found: warn

  publish:
    # Android must have built. The Mac images are added when the mac job passed; otherwise platforms.macos is removed.
    needs: [build, mac]
    if: ${{ always() && needs.build.result == 'success' && needs.build.outputs.rebuild == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KODI_VER: ${{ needs.build.outputs.kodi_ver }}
      SRC_HASH: ${{ needs.build.outputs.src_hash }}
      NEXT_BUILD: ${{ needs.build.outputs.next_build }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      MAC_OK: ${{ needs.mac.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: fefc-apks
          path: .
      - uses: actions/download-artifact@v4
        if: env.MAC_OK == 'true'
        with:
          name: fefc-mac
          path: dist
      - name: Write version.json (Android fields, then platforms.macos from this build)
        run: |
          set -euo pipefail
          SHA=$(sha256sum FEFC-Kodi.apk | cut -d' ' -f1); SIZE=$(stat -c%s FEFC-Kodi.apk)
          SHA2=$(sha256sum FEFC.apk | cut -d' ' -f1); SIZE2=$(stat -c%s FEFC.apk)
          # Same Android fields as before. If a platforms object is already on the server, it is copied
          # onto the new file, then the Mac entry is replaced with this build's images (or removed).
          SHA="$SHA" SIZE="$SIZE" SHA2="$SHA2" SIZE2="$SIZE2" python3 tools/fefc_release_manifest.py write-android --out version.json
          python3 tools/fefc_release_manifest.py attach-macos --manifest version.json --dir dist --build "$NEXT_BUILD" --version "$APP_VERSION" --kodi "$KODI_VER" --ok "$MAC_OK"
          cat version.json | head -c 2000; echo
      - name: Build the Kodi add-on repository from this checkout
        run: |
          set -euo pipefail
          python3 tools/build_kodi_repo.py
          python3 - <<'PY'
          import re
          src = open('kodi-src/plugin.video.fefc/addon.xml', encoding='utf-8').read()
          want = re.search(r'<addon[^>]*\bversion="([^"]+)"', src).group(1)
          repo = open('kodi-repo/addons.xml', encoding='utf-8').read()
          got = re.search(r'<addon id="plugin.video.fefc"[^>]*\bversion="([^"]+)"', repo).group(1)
          assert got == want, (got, want)
          print('kodi-repo plugin.video.fefc', got)
          PY
      - name: Upload to R2 (APKs, Mac images, add-on repo, then version.json last)
        run: |
          set -euo pipefail
          npm ci >/dev/null 2>&1 || npm install >/dev/null 2>&1
          put() { npx wrangler r2 object put "fan-edit-media/$1" --file="$2" --content-type="$3" --remote; }
          put kodi/FEFC-Kodi.apk FEFC-Kodi.apk application/vnd.android.package-archive
          put kodi/FEFC.apk FEFC.apk application/vnd.android.package-archive
          if [ "$MAC_OK" = "true" ]; then
            put kodi/FEFC-Mac.dmg dist/FEFC-Mac.dmg application/x-apple-diskimage
            put kodi/FEFC-Mac-Intel.dmg dist/FEFC-Mac-Intel.dmg application/x-apple-diskimage
          fi
          ( cd kodi-repo && find . -type f ! -name 'addons.xml' ! -name 'addons.xml.md5' | sed 's|^\./||' | sort ) | while read -r f; do
            case "$f" in *.zip) ct=application/zip ;; *.png) ct=image/png ;; *.jpg) ct=image/jpeg ;; *) ct=application/octet-stream ;; esac
            put "kodi-repo/$f" "kodi-repo/$f" "$ct"
          done
          put kodi-repo/addons.xml kodi-repo/addons.xml application/xml
          put kodi-repo/addons.xml.md5 kodi-repo/addons.xml.md5 text/plain
          put kodi/version.json version.json application/json
          cat version.json | python3 -c "import json,sys;v=json.load(sys.stdin);print(v['version'],v['build'],sorted(v.get('platforms',{})))"
