name: catalog-snapshot

# Free daily refresh (GitHub Actions only - no box, no Grok usage). 12:00 UTC = 7 AM ET.
# Read-only Drive crawl (public folder view) + enrichment from free public sources, then commit data/ and deploy Pages ONLY when
# something changed. The web app, Fire TV app and Kodi add-on all read the same /data/*.json, so one refresh updates all three.
# Safety: tools/ci_guard.py aborts if the crawl returns <90% of the previous catalogue and restores any data file that shrank >20%.
# Keeps the live firetv/version.json and never ships the APK (APK releases are ship.yml).
on:
  workflow_dispatch:
    inputs:
      enrich:
        description: "Run enrichment (artwork, descriptions, ratings, genres)"
        type: boolean
        default: true
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENRICH: ${{ github.event_name == 'schedule' || inputs.enrich }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: |
          npm ci || npm install
          pip install pillow
      - name: Restore probe cache
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: fefc-probe-cache-${{ github.run_id }}
          restore-keys: fefc-probe-cache-

      # ---- 1. Catalogue from Drive (read-only) ----
      - name: Crawl Drive (new files, folders, docs), links, dates, added
        run: |
          set -euo pipefail
          python3 tools/crawl.py
          python3 tools/links.py
          python3 tools/dates.py
          python3 tools/added.py
      - name: Classify new files
        if: env.ENRICH == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 tools/classify_probe.py
          python3 tools/classify.py

      # ---- 2. Enrichment from free public sources (each step is independent; a failure never blocks the others) ----
      - name: "Descriptions + fan-edit info (IFDb / fanedit.org, Wikipedia, bestedit)"
        if: env.ENRICH == 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          IFDB_MINUTES: "18"
        run: python3 tools/editinfo.py
      - name: "Film metadata (Wikidata / Wikipedia: plot, cast, runtime, IMDb ids)"
        if: env.ENRICH == 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: python3 tools/metadata.py
      - name: Ratings (moviesremastered / MRDb, fanedit.org IFDb)
        if: env.ENRICH == 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: python3 tools/fanedit_ratings.py --budget-sec 900
      - name: Artwork (posters, pinned art, folder thumbnails)
        if: env.ENRICH == 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python3 tools/posters.py
          python3 tools/poster_fix.py
          python3 tools/folderthumbs.py
      - name: Genres (per-video + collection genres), shuffle, search titles
        if: env.ENRICH == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 tools/video_genres.py
          python3 tools/genre_collections.py
          python3 tools/shuffle.py
          python3 tools/ai_titles.py

      # ---- 3. Safety, commit, deploy ----
      - name: Safety guard (never wipe the catalogue)
        run: python3 tools/ci_guard.py
      - name: Commit + push data
        id: commit
        run: |
          set -euo pipefail
          git config user.name "fefc-collection-resync"
          git config user.email "actions@github.com"
          git add -A data/
          git add -A assets/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Daily catalogue + enrichment refresh ($(date -u +%F))"
            git pull --rebase --autostash origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Pages (no APK / Android sources; keeps live version.json)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"; mkdir -p "$SITE"
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude '.github' --exclude 'firetv' --exclude 'kodi-src' --exclude 'tools/cache' ./ "$SITE/"
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; } || true
          python3 tools/kodi_sfx.py assets/sfx "$SITE/kodi-sfx" || echo "kodi sfx conversion skipped"
          mkdir -p "$SITE/firetv"
          curl -fsS "https://collection.faneditfanclub.com/firetv/version.json?ts=$(date +%s)" -o "$SITE/firetv/version.json"
          cd "$SITE"
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy . --project-name fefc-collection --branch main --commit-dirty=true
