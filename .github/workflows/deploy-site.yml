name: deploy-site

# Manual quick deploy of the current main to Cloudflare Pages (no crawl/enrichment). Same copy rules as catalog-snapshot:
# no APK / Android sources, keeps the live firetv/version.json.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy-quick
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - name: Deploy Pages
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"; mkdir -p "$SITE"
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude '.github' --exclude 'firetv' --exclude 'kodi-src' --exclude 'tools/cache' ./ "$SITE/"
          python3 tools/kodi_sfx.py assets/sfx "$SITE/kodi-sfx"
          mkdir -p "$SITE/firetv"
          curl -fsS "https://collection.faneditfanclub.com/firetv/version.json?ts=$(date +%s)" -o "$SITE/firetv/version.json"
          cd "$SITE"
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy . --project-name fefc-collection --branch main --commit-dirty=true
